name: Auto release (beta)

# Fully automatic releases. Every push to main:
#   - the version comes from the version file (VERSION),
#   - if that version was never released, a GitHub Release is published
#     (tag vX.Y.Z, marked as beta prerelease).
# Bumping = edit the VERSION file in your change:
#   - small update: 0.5.0 -> 0.5.1
#   - big update:   0.5.0 -> 0.6.0
# Commits without a version bump simply don't release.

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  PROJECT_DIR: .
  APP_NAME: Zalith2WindowsSupport

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: ${{ env.PROJECT_DIR }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # needed to list existing tags

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Read version
        id: ver
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT

      - name: Check if this version was already released
        id: fresh
        shell: pwsh
        run: |
          $tag = "v$((Get-Content VERSION -Raw).Trim())"
          $exists = git tag -l $tag
          if ($exists) {
            "should_release=false" >> $env:GITHUB_OUTPUT
            Write-Host "$tag already exists - skipping release"
          } else {
            "should_release=true" >> $env:GITHUB_OUTPUT
            Write-Host "$tag is new - will release"
          }

      - name: Build portable app
        run: .\gradlew.bat --no-daemon createDistributable

      - name: Build uber jar
        run: .\gradlew.bat --no-daemon packageUberJarForCurrentOS

      - name: Build installers (optional)
        continue-on-error: true
        run: .\gradlew.bat --no-daemon packageExe packageMsi

      - name: Zip portable app
        run: Compress-Archive -Path build/compose/binaries/main/app/${{ env.APP_NAME }} -DestinationPath ${{ env.APP_NAME }}-windows-portable-${{ steps.ver.outputs.version }}.zip

      - name: Publish beta release
        if: steps.fresh.outputs.should_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.tag }} (Beta)
          body: |
            **Beta release** of Zalith 2 Windows Support, built automatically from main.

            - Portable zip: unzip and run `Zalith2WindowsSupport\Zalith2WindowsSupport.exe` (no install needed)
            - Jar: needs a JDK 17+ installed
            - Exe / Msi: Windows installers

            OptiFine, Fabric, Quilt, Forge (1.13+), NeoForge, Modrinth mods and modpacks are supported.
            Microsoft sign-in needs an approved Azure app ID (see README). This is an **Unofficial Modified Version** of Zalith Launcher 2 (GPL-3.0).
          draft: false
          prerelease: true
          files: |
            ${{ env.PROJECT_DIR }}/${{ env.APP_NAME }}-windows-portable-*.zip
            ${{ env.PROJECT_DIR }}/build/compose/jars/*.jar
            ${{ env.PROJECT_DIR }}/build/compose/binaries/main/exe/*.exe
            ${{ env.PROJECT_DIR }}/build/compose/binaries/main/msi/*.msi

      - name: Upload artifacts (every push)
        uses: actions/upload-artifact@v4
        with:
          name: Zalith2WindowsSupport-${{ steps.ver.outputs.version }}
          path: |
            ${{ env.PROJECT_DIR }}/${{ env.APP_NAME }}-windows-portable-*.zip
            ${{ env.PROJECT_DIR }}/build/compose/jars/*.jar
            ${{ env.PROJECT_DIR }}/build/compose/binaries/main/exe/*.exe
            ${{ env.PROJECT_DIR }}/build/compose/binaries/main/msi/*.msi
